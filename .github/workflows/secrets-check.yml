# Holder sharing: CHECK THE ENVIRONMENT SECRETS, by hand only.
#
# GitHub never shows a secret again once saved, so a value pasted in the wrong
# shape is otherwise found when a scheduled run fails. This runs
# services/sharer/scripts/check-secrets.mjs in each environment: every secret
# is used the way the keeper uses it and reported PASS or FAIL, and no value
# is ever printed. Run it after entering or rotating any secret
# (services/sharer/RUNBOOK.md parts 9.1 and 12).
#
# It writes one probe file to the data repository and deletes it, and sends
# one Telegram message per environment.

name: secrets-check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mainnet:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: sharing-mainnet
    defaults:
      run:
        working-directory: services/sharer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.0"
      - name: Install exactly the lockfile (no install scripts)
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Check the sharing-mainnet secrets
        env:
          SHARING_PUBLISHER_KEY: ${{ secrets.SHARING_PUBLISHER_KEY }}
          SHARING_STANDBY_PUSHER_KEY: ${{ secrets.SHARING_STANDBY_PUSHER_KEY }}
          SHARING_RPC_URLS: ${{ secrets.SHARING_RPC_URLS }}
          SHARING_DATA_REPO_TOKEN: ${{ secrets.SHARING_DATA_REPO_TOKEN }}
          SHARING_PIN_TOKENS: ${{ secrets.SHARING_PIN_TOKENS }}
          SHARING_ALERT_WEBHOOKS: ${{ secrets.SHARING_ALERT_WEBHOOKS }}
        run: node scripts/check-secrets.mjs mainnet

  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: sharing-verify
    defaults:
      run:
        working-directory: services/sharer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.0"
      - name: Install exactly the lockfile (no install scripts)
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Check the sharing-verify secrets
        env:
          SHARING_VERIFY_RPC_URLS: ${{ secrets.SHARING_VERIFY_RPC_URLS }}
          SHARING_ALERT_WEBHOOKS: ${{ secrets.SHARING_ALERT_WEBHOOKS }}
        run: node scripts/check-secrets.mjs verify
