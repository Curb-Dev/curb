# The launches' history, indexed for the site (services/sharer/scripts/index-history.ts).
#
# Every 15 minutes: for each launch the registry lists, the logs its page draws
# from - its curve, its token, the CURB router's sales of it, its pool once it
# graduated - read from the block after the last file and written to the data
# repo at sharing/<chain>/history/<token>.json, which the site serves under
# /sharing/<chain>/history/. A launch's page reads that file, checks every log
# in it, and reads the chain itself only after its last block (web/token.js
# historyIndex); without the file it reads the chain from the launch's start,
# as it always did. Display only: nothing is sent on what the file says.
# And sharing/<chain>/stats.json, when its numbers change: each launch's
# trades, traders, volumes and holders, counted from those files alone, for
# screeners and the owner's weekly figures (the site does not read it).
#
# The sharing-mainnet environment's RPC URLs and data repo token, as the
# keeper uses them; no key is read. Never on a pull request; every action
# pinned to a commit; one run at a time.

name: history-index

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: history-index
  cancel-in-progress: false

jobs:
  index:
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: sharing-mainnet
    defaults:
      run:
        working-directory: services/sharer
    env:
      CURB_SHARER_CONFIG: deploy/sharer.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.0"

      - name: Install exactly the lockfile (no install scripts)
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Index every launch's history
        env:
          CURB_SHARER_RPC_URLS: ${{ secrets.SHARING_RPC_URLS }}
          CURB_SHARER_DATA_REPO_TOKEN: ${{ secrets.SHARING_DATA_REPO_TOKEN }}
        run: node scripts/index-history.ts
