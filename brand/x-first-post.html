<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CURB — first post</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0e}
  body{font-family:Inter,ui-sans-serif,-apple-system,"Segoe UI",sans-serif;color:#f4f6f9}
  .stage{position:relative;width:1280px;height:720px;overflow:hidden;background:
    radial-gradient(circle at 78% 20%,rgba(245,165,36,.11),transparent 30%),
    linear-gradient(145deg,#181d25 0%,#0e1116 58%,#090b0e 100%)}
  .grain{position:absolute;inset:0;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}
  .road{position:absolute;left:0;right:0;bottom:108px;height:16px;background:repeating-linear-gradient(90deg,#242a33 0 88px,transparent 88px 142px);opacity:0;animation:road 1s 1s forwards}
  .kerb{position:absolute;left:-20px;right:-20px;bottom:194px;height:24px;background:#e9ecf0;transform:translateY(110px);animation:kerb 1s .35s cubic-bezier(.2,.8,.2,1) forwards}
  .kerb:after{content:"";position:absolute;top:-7px;left:39%;right:0;height:7px;background:linear-gradient(90deg,transparent,#f5a524 18%,#f5a524)}
  .riser{position:absolute;left:39%;bottom:108px;width:24px;height:110px;background:#e9ecf0;transform:translateY(110px);animation:kerb 1s .35s cubic-bezier(.2,.8,.2,1) forwards}
  .brand{position:absolute;left:112px;top:92px;display:flex;align-items:center;gap:26px;opacity:0;transform:translateY(18px);animation:enter .75s .1s forwards}
  .brand img{width:92px;height:92px;border-radius:50%}
  .brand span{font-family:Georgia,"Times New Roman",serif;font-size:72px;font-weight:700;letter-spacing:8px}
  .scene{position:absolute;left:510px;top:145px;width:660px}
  .line{opacity:0;transform:translateY(18px);animation:enter .7s forwards}
  .line.one{font-size:29px;color:#aeb6c2;letter-spacing:2px;animation-delay:1.55s}
  .line.two{font-family:Georgia,"Times New Roman",serif;font-size:66px;line-height:1.03;margin-top:20px;animation-delay:2.15s}
  .line.two em{font-style:normal;color:#f5a524}
  .line.three{font-size:26px;color:#aeb6c2;margin-top:28px;animation-delay:3.25s}
  .ticker{position:absolute;left:510px;bottom:131px;font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace;color:#f5a524;letter-spacing:2px;opacity:0;animation:enter .6s 4.1s forwards}
  .site{position:absolute;right:82px;bottom:46px;font:19px ui-monospace,SFMono-Regular,Menlo,monospace;color:#7f8997;letter-spacing:2px;opacity:0;animation:enter .6s 4.5s forwards}
  .status{position:absolute;left:82px;bottom:45px;color:#7f8997;font-size:17px;letter-spacing:.8px;opacity:0;animation:enter .6s 4.5s forwards}
  @keyframes enter{to{opacity:1;transform:translateY(0)}}
  @keyframes kerb{to{transform:translateY(0)}}
  @keyframes road{to{opacity:1}}
</style>
<div class="stage">
  <div class="grain"></div><div class="road"></div><div class="riser"></div><div class="kerb"></div>
  <div class="brand"><img src="curb-avatar.svg" alt=""><span>CURB</span></div>
  <main class="scene">
    <div class="line one">MOST LAUNCHPADS PRICE AGAINST ETH.</div>
    <div class="line two">What if every launch traded against a <em>real ticker?</em></div>
    <div class="line three">Stock-paired launches. Built on Base.</div>
  </main>
  <div class="ticker">NVDA · AAPL · TSLA</div>
  <div class="status">BUILDING IN PUBLIC · NOT LIVE YET</div>
  <div class="site">curbfun.xyz</div>
</div>
</html>
